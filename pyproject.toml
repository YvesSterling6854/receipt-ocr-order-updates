[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-ocr-order-updates"
version = "0.1.0"
description = "OCR scanned receipts and publish searchable order updates"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["receipt_update_service", "infrai_pdf_client"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
